CTS:
  fm_yaml:   'config/formods.yaml'
  mod_yaml:  'config/CTS.yaml'
  elements:
   - element:
       idx:    1
       name:   "Single dose"
       # General options for the trial.
       # Everything but the element_name and
       # source_model fields
       cts_options:
         nsub:                 3
         visit_times:          0
         trial_end:            100
         fpage:                "1"
         dvcols:               "Cc"
         time_scale:           ""
         tc_dim:               "d2x4"
         evplot:                1
         cts_config_atol:      "1e-8"
         cts_config_rtol:      "1e-6"
         cts_config_sigdig:    "NULL"
         cts_config_seed:      "5446"
         cts_config_nsteps:     5
         cts_config_preamble:   NULL
       model_source:
         id:   "MB"  # Module ID
         idx:    1   # Data source index
       # Rule/action combinations
       components:
         - component:
             name:         "first_dose"
             type:         "dose"
             condition:    "time == 0"
             state:        "central"
             values:       "c(1)"
             times:        "c(0)"
             durations:    "c(0)"
